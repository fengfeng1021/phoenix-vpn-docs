<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phoenix 雲端 Chrome · 美國原生</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
<style>body{font-family:'Noto Sans TC',system-ui}.mono{font-family:'JetBrains Mono',monospace}</style>
</head>
<body class="bg-[#fafaf9] min-h-screen">
<div class="max-w-6xl mx-auto p-4 md:p-6">
  <nav class="flex items-center justify-between mb-4">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-zinc-900 text-white grid place-items-center font-bold">US</div>
      <div><div class="font-bold">Phoenix 雲端 Chrome</div><div class="text-xs text-zinc-500">1920x1080 · 120fps · 30Mbps · 無痕 · 129.146.115.218</div></div>
    </div>
    <div class="flex items-center gap-2">
      <span id="dot" class="text-xs px-3 py-1 rounded-full bg-zinc-100 border">檢測中...</span>
      <a href="./index.html" class="text-xs underline text-zinc-500">文檔 →</a>
    </div>
  </nav>

  <div class="bg-white border rounded-xl overflow-hidden" style="height: 78vh">
    <div class="px-4 py-2 bg-zinc-900 text-white flex items-center justify-between">
      <span class="text-sm font-bold">☁ 雲端 Chrome · 像本地一樣 · 支援登入、影片、Google Pay</span>
      <div class="flex gap-2">
        <button id="btnFresh" class="text-xs px-3 py-1.5 bg-amber-500 text-white rounded-lg">全新會話</button>
        <button id="btnOpen" class="text-xs px-3 py-1.5 bg-white text-zinc-900 rounded-lg">新分頁全螢幕</button>
        <button id="btnFs" class="text-xs px-3 py-1.5 bg-white/10 border border-white/20 rounded-lg">全螢幕</button>
      </div>
    </div>
    <div id="info" class="px-4 py-2 bg-amber-50 text-xs text-amber-900 border-b">首次載入會彈登入：帳號 <span class="mono bg-white px-1 py-0.5 rounded border">fengfeng1021</span> 密碼 <span class="mono bg-white px-1 py-0.5 rounded border">私訊取得</span> · 每次打開自動全新無痕 · 關閉即丟棄</div>
    <iframe id="frame" class="w-full h-full border-0 bg-white" allow="clipboard-read; clipboard-write; fullscreen" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads"></iframe>
  </div>
  <div class="mt-3 flex gap-3 text-xs">
    <span id="via" class="mono text-zinc-500"></span>
    <span class="ml-auto text-zinc-400">零安裝 · 任何電腦 · 每30分鐘自動喚醒 + 無痕</span>
  </div>
</div>
<script>
let BROWSER = "https://acceptance-washer-rank-bonds.trycloudflare.com";
let PROXY = "https://129-146-115-218.sslip.io";
let TOKEN = "phoenix2026";
let AUTH = localStorage.getItem('phoenix_auth') || "";
async function loadTunnel(){
  try{
    if(!AUTH){
      const p = prompt('請輸入 Phoenix 密碼：', '');
      if(p){ AUTH = p; localStorage.setItem('phoenix_auth', p); }
    }
    if(AUTH){
      const r = await fetch('https://129-146-115-218.sslip.io/tunnel?auth=' + encodeURIComponent(AUTH));
      if(r.ok){
        const j = await r.json();
        BROWSER = j.browser || BROWSER;
      } else {
        alert('密碼錯誤');
        localStorage.removeItem('phoenix_auth'); AUTH="";
      }
    }
    document.getElementById('via').textContent = '瀏覽器 ' + BROWSER;
  }catch(e){ document.getElementById('via').textContent = '瀏覽器 ' + BROWSER + ' (fallback)'; }
  check();
}
async function check(){
  const dot=document.getElementById('dot');
  try{
    const r=await fetch(PROXY + '/health'); await r.json();
    dot.textContent='● 已連接 Phoenix'; dot.className='text-xs px-3 py-1 rounded-full bg-emerald-500 text-white';
  }catch{ dot.textContent='○ 未連接'; dot.className='text-xs px-3 py-1 rounded-full bg-amber-100 text-amber-800 border'; }
}
async function freshAndLoad(){
  const info=document.getElementById('info');
  try{
    info.textContent='正在準備全新會話（清除上次 cookie，約3秒）...';
    await fetch(PROXY + '/browser/fresh?token=' + TOKEN);
    await new Promise(r=>setTimeout(r, 3000));
    info.textContent='已是全新會話：帳號 fengfeng1021 密碼 WJF7374520wjf · 無痕模式';
  }catch{ info.textContent='全新會話準備中...'; }
  document.getElementById('frame').src = BROWSER + '?t=' + Date.now();
}
document.getElementById('btnFresh').onclick = freshAndLoad;
document.getElementById('btnOpen').onclick = ()=> window.open(BROWSER, '_blank');
document.getElementById('btnFs').onclick = ()=>{ const f=document.getElementById('frame'); if(f.requestFullscreen) f.requestFullscreen(); };
loadTunnel().then(()=>{ freshAndLoad(); });
setInterval(check, 10000);
</script>
</body>
</html>
